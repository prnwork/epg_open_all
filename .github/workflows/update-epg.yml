name: Update EPG Guide

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
permissions:
  contents: write

jobs:
  update-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate and Merge EPG
        shell: python3 {0}
        run: |
          import re
          import os
          import gzip

          os.makedirs("public", exist_ok=True)
          
          # List your source XML/XMLTV URLs or local files here if needed, 
          # or point to your running JTV-GO / source feeds.
          xml_files = [] # Add paths if downloading or pulling in previous steps
          
          # Fallback or base structure for merged output
          out_path_xml = "public/guide.xml"
          out_path_gz = "public/guide.xml.gz"

          print("Starting EPG merge process...")
          
          # Example merge routine framework:
          seen_channel_ids = set()
          total_channels = 0
          total_programmes = 0

          with open(out_path_xml, "w", encoding="utf-8") as out_xml, gzip.open(out_path_gz, "wt", encoding="utf-8") as out_gz:
              header = '<?xml version="1.0" encoding="UTF-8"?>\n<tv>\n'
              out_xml.write(header)
              out_gz.write(header)

              # Placeholder loop for processing channel/programme blocks safely
              # (Ensure your feed inputs are appended here)

              footer = "</tv>"
              out_xml.write(footer)
              out_gz.write(footer)

          print(f"Merged {total_channels} unique channels and {total_programmes} programmes successfully.")

      - name: Check File Sizes and Guard Limits
        run: |
          if [ -f "public/guide.xml" ]; then
            XML_MB=$(du -m "public/guide.xml" | cut -f1)
            GZ_MB=$(du -m "public/guide.xml.gz" | cut -f1)
            echo "Final sizes -> guide.xml: ${XML_MB} MB | guide.xml.gz: ${GZ_MB} MB"
            if [ "${XML_MB}" -ge 95 ]; then
              echo "Uncompressed guide.xml (${XML_MB} MB) exceeds GitHub 95 MB limit; publishing guide.xml.gz only."
              rm -f public/guide.xml
            fi
          fi
          date -u +"%Y-%m-%dT%H:%M:%SZ" > public/last_updated.txt
          ls -lh public/

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "chore(epg): auto-update merged all-channels guide.xml.gz [skip ci]"
