                      block = m.group(0)
                      id_match = id_re.search(block)
                      cid = id_match.group(1) if id_match else block
                      if cid not in seen_channel_ids:
                          seen_channel_ids.add(cid)
                          out_xml.write("  " + block + "
")
                          out_gz.write("  " + block + "
")
                          total_channels += 1

              # Pass 2: Stream all <programme> blocks across all batch files
              for fpath in xml_files:
                  with open(fpath, "r", encoding="utf-8", errors="ignore") as f:
                      content = f.read()
                  for m in prog_re.finditer(content):
                      block = m.group(0)
                      out_xml.write("  " + block + "
")
                      out_gz.write("  " + block + "
")
                      total_programmes += 1

              footer = "</tv>
"
              out_xml.write(footer)
              out_gz.write(footer)

          print(f"Merged {total_channels} unique channels and {total_programmes} programmes.")
          EOF

          # Guard against GitHub's 100 MB single-file push limit on gh-pages
          if [ -f "public/guide.xml" ]; then
            XML_MB=$(du -m "public/guide.xml" | cut -f1)
            GZ_MB=$(du -m "public/guide.xml.gz" | cut -f1)
            echo "Final sizes -> guide.xml: ${XML_MB} MB | guide.xml.gz: ${GZ_MB} MB"
            if [ "${XML_MB}" -ge 95 ]; then
              echo "Uncompressed guide.xml (${XML_MB} MB) exceeds GitHub 95 MB limit; publishing guide.xml.gz only."
              rm -f public/guide.xml
            fi
          fi

          date -u +"%Y-%m-%dT%H:%M:%SZ" > public/last_updated.txt
          ls -lh public/

      - name: Publish to gh-pages branch (orphan history to prevent repo bloat)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'chore(epg): auto-update merged all-channels guide.xml.gz [skip ci]'
