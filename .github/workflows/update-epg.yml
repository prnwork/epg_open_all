name: Update EPG Guide

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  update-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate and Merge EPG
        shell: python3 {0}
        run: |
          import re
          import os
          import gzip
          import urllib.request

          os.makedirs("public", exist_ok=True)
          os.makedirs("temp_epgs", exist_ok=True)

          # EPG sources for India, UK, US, JioTV, and Tata Play
          epg_urls = [
              "https://epgshare01.online/epgshare01/epg_ripper_IN4.xml.gz",
              "https://epgshare01.online/epgshare01/epg_ripper_UK1.xml.gz",
              "https://epgshare01.online/epgshare01/epg_ripper_US2.xml.gz",
              "https://raw.githubusercontent.com/mitthu786/tvepg/main/jiotv/epg.xml.gz",
              "https://raw.githubusercontent.com/mitthu786/tvepg/main/tataplay/epg.xml.gz"
          ]

          xml_files = []
          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}

          for i, url in enumerate(epg_urls):
              try:
                  print(f"Downloading EPG from {url}...")
                  local_path = f"temp_epgs/source_{i}.xml"
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=90) as response, open(local_path, 'wb') as out_file:
                      out_file.write(response.read())
                  
                  if url.endswith(".gz"):
                      decompressed_path = f"temp_epgs/source_{i}_dec.xml"
                      with gzip.open(local_path, "rb") as f_in, open(decompressed_path, "wb") as f_out:
                          f_out.write(f_in.read())
                      xml_files.append(decompressed_path)
                  else:
                      xml_files.append(local_path)
              except Exception as e:
                  print(f"Error fetching {url}: {e}")

          out_path_xml = "public/guide.xml"
          out_path_gz = "public/guide.xml.gz"

          print("Starting EPG merge process...")
          
          seen_channel_ids = set()
          total_channels = 0
          total_programmes = 0

          channel_re = re.compile(r'<channel\s+id="([^"]+)"[^>]*>.*?</channel>', re.DOTALL)
          prog_re = re.compile(r'<programme\s+[^>]*>.*?</programme>', re.DOTALL)

          with open(out_path_xml, "w", encoding="utf-8", errors="ignore") as out_xml, \
               gzip.open(out_path_gz, "wt", encoding="utf-8", errors="ignore") as out_gz:
              
              header = '<?xml version="1.0" encoding="UTF-8"?>\n<tv generator-info-name="Custom-EPG-Merger">\n'
              out_xml.write(header)
              out_gz.write(header)

              for fpath in xml_files:
                  if not os.path.exists(fpath):
                      continue
                  with open(fpath, "r", encoding="utf-8", errors="ignore") as f:
                      content = f.read()
                  for m in channel_re.finditer(content):
                      block = m.group(0)
                      cid = m.group(1)
                      if cid not in seen_channel_ids:
                          seen_channel_ids.add(cid)
                          out_xml.write("  " + block + "\n")
                          out_gz.write("  " + block + "\n")
                          total_channels += 1

              for fpath in xml_files:
                  if not os.path.exists(fpath):
                      continue
                  with open(fpath, "r", encoding="utf-8", errors="ignore") as f:
                      content = f.read()
                  for m in prog_re.finditer(content):
                      block = m.group(0)
                      out_xml.write("  " + block + "\n")
                      out_gz.write("  " + block + "\n")
                      total_programmes += 1

              footer = "</tv>\n"
              out_xml.write(footer)
              out_gz.write(footer)

          print(f"Merged {total_channels} unique channels and {total_programmes} programmes successfully.")

      - name: Generate Clean IPTV-Org M3U Lists (Matching EPG IDs)
        run: |
          curl -sL https://iptv-org.github.io/iptv/index.m3u | sed -E 's/(tvg-id="[^"@]+)@[^"]*"/\1"/g' > public/index.m3u
          curl -sL https://iptv-org.github.io/iptv/countries/in.m3u | sed -E 's/(tvg-id="[^"@]+)@[^"]*"/\1"/g' > public/in.m3u
          curl -sL https://iptv-org.github.io/iptv/languages/kan.m3u | sed -E 's/(tvg-id="[^"@]+)@[^"]*"/\1"/g' > public/kan.m3u

      - name: Check File Sizes and Guard Limits
        run: |
          if [ -f "public/guide.xml" ]; then
            XML_MB=$(du -m "public/guide.xml" | cut -f1)
            GZ_MB=$(du -m "public/guide.xml.gz" | cut -f1)
            echo "Final sizes -> guide.xml: ${XML_MB} MB | guide.xml.gz: ${GZ_MB} MB"
            if [ "${XML_MB}" -ge 95 ]; then
              echo "Uncompressed guide.xml (${XML_MB} MB) exceeds 95 MB limit; publishing guide.xml.gz only."
              rm -f public/guide.xml
            fi
          fi
          date -u +"%Y-%m-%dT%H:%M:%SZ" > public/last_updated.txt
          ls -lh public/

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "chore(epg): auto-update merged guide and clean M3Us [skip ci]"
